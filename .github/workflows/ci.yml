name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Go tests split across shards balanced by package duration
  # (tools/ci-shard, scripts/ci-test-durations.json).
  go-test:
    name: go-test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A shard takes about 5 min; a stuck step must not hold the run for the
    # 6 h default.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: flopwire
          POSTGRES_USER: flopwire
          POSTGRES_PASSWORD: flopwire-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flopwire -d flopwire"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Postgres integration tests create and drop their own databases.
      FLOPWIRE_TEST_DATABASE_URL: postgres://flopwire:flopwire-ci@127.0.0.1:5432/flopwire?sslmode=disable
      # S3 integration tests (pgtest.NewBucket) create their own buckets.
      FLOPWIRE_TEST_S3_ENDPOINT: 127.0.0.1:9000
      FLOPWIRE_TEST_S3_ACCESS_KEY: flopwire
      FLOPWIRE_TEST_S3_SECRET_KEY: flopwire-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false
      # plugins/opencode's test drives the opencode plugin with node; it
      # fails, not skips, without node under CI.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # One cache per shard: setup-go's shared key would keep whichever
      # job saved first, without the -race build of the other shards.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('go.sum') }}
      # MinIO is a step, not a service: services cannot pass `server /data`.
      # Same pinned image as compose.yaml.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=flopwire -e MINIO_ROOT_PASSWORD=flopwire-ci-secret \
            cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9 server /data
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      # The backup round trip needs pg_dump/pg_restore >= the server major (17);
      # the runner image ships 16.
      # apt.postgresql.org can stall; bound each attempt and retry.
      - name: Install PostgreSQL 17 client
        # 3 attempts x (2 x 150 s + 10 s) fits under 16 min.
        timeout-minutes: 16
        run: |
          for attempt in 1 2 3; do
            # Finish any install a killed attempt left half-configured.
            sudo dpkg --configure -a || true
            if sudo timeout 150 /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null &&
              sudo timeout 150 apt-get install -y -q --no-install-recommends postgresql-client-17 >/dev/null; then
              echo /usr/lib/postgresql/17/bin >>"$GITHUB_PATH"
              exit 0
            fi
            echo "::warning::PostgreSQL 17 client install attempt $attempt failed"
            sleep 10
          done
          exit 1
      - name: Pick this shard's packages
        run: |
          go run ./tools/ci-shard -shards ${{ strategy.job-total }} -index ${{ matrix.shard }} >"$RUNNER_TEMP/packages"
          cat "$RUNNER_TEMP/packages"
          test -s "$RUNNER_TEMP/packages"
      - name: Go tests
        run: |
          # One package path per line, no spaces: word splitting is intended.
          # shellcheck disable=SC2046
          scripts/ci-go-test.sh -race $(cat "$RUNNER_TEMP/packages")
      # Feeds the coverage check in `test` and refreshes of the duration file.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-test-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test.json
          retention-days: 14
          if-no-files-found: error

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # macOS is the main agent platform but CI runs Linux: vet both, so the
      # darwin-only files (kqueue watcher, file identity, caller detection)
      # at least compile and pass vet.
      - name: Vet (linux and darwin)
        run: |
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...
      # The go-test shards run with -race, under which TestPackageInitCost
      # skips its dependency caps. Run the init guards once without -race.
      - name: Init cost guards (no -race)
        run: go test -count=1 -run '^(TestPackageInitCost|TestInitAndVersionRunNoProgram)$' -v ./cmd/flopwire
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: scripts/validate-release-tag_test.sh
      - run: scripts/perf-baseline_test.sh
      - name: Build the image with the release version
        env:
          FLOPWIRE_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          docker build --build-arg VERSION="$FLOPWIRE_BUILD_VERSION" -t flopwire:test .
          test "$(docker run --rm flopwire:test version)" = "$FLOPWIRE_BUILD_VERSION"
          docker run --rm --entrypoint pg_dump flopwire:test --version
      - name: Boot from fresh Compose volumes as the non-root user
        env:
          FLOPWIRE_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: scripts/validate-fresh-compose.sh flopwire:test linux/amd64 "$FLOPWIRE_BUILD_VERSION"

  # The required check on main. It passes only when every shard and the
  # other checks passed and the shards together ran each package once.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [go-test, checks]
    if: always()
    steps:
      - name: Require every job to pass
        env:
          GO_TEST: ${{ needs.go-test.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "go-test: $GO_TEST, checks: $CHECKS"
          test "$GO_TEST" = success && test "$CHECKS" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: go-test-*
          path: ${{ runner.temp }}/shards
      - name: Every package ran in exactly one shard
        run: go run ./tools/ci-shard -verify "$RUNNER_TEMP"/shards/*/go-test.json
