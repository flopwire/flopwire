name: E2E sync

# The two-device scenario suite (scripts/e2e-sync.sh): Compose server with
# Postgres and MinIO over self-signed TLS, two `flopwire agent run` devices
# pinning its fingerprint, synthetic transcripts generated by the test
# itself. FLOPWIRE_E2E_CORPUS stays unset, so no real harness data is read.
on:
  pull_request:
    branches: [main, integ/full]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-sync:
    name: e2e-sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image (layer cache in GitHub Actions)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: flopwire-e2e:ci
          cache-from: type=gha,scope=e2e-server
          cache-to: type=gha,scope=e2e-server,mode=max
      - name: Two-device sync scenarios
        env:
          FLOPWIRE_E2E_IMAGE: flopwire-e2e:ci
          FLOPWIRE_E2E_REPORT: ${{ runner.temp }}/e2e-report.md
          # Keep the work dir and Compose project so a failure can be
          # inspected; the runner is thrown away anyway.
          FLOPWIRE_E2E_KEEP: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          TMPDIR="$RUNNER_TEMP/e2e" scripts/e2e-sync.sh
      - name: Collect logs on failure
        if: failure()
        run: |
          for p in $(docker compose ls -a -q | grep flopwire-e2esync); do
            docker compose -p "$p" logs --no-color >"$RUNNER_TEMP/e2e/compose-$p.log" 2>&1 || true
            docker compose -p "$p" exec -T postgres psql -U flopwire -d flopwire -P pager=off -c "
              SELECT d.name AS device, c.agent, c.session_id, count(*) FILTER (WHERE NOT m.superseded) AS live,
                     count(*) FILTER (WHERE m.superseded) AS superseded
              FROM conversations c JOIN devices d ON d.id=c.device_id LEFT JOIN messages m ON m.conversation_id=c.id
              GROUP BY 1,2,3 ORDER BY 2,3,1;" -c "
              SELECT s.path, s.agent, p.requested_seq, p.parsed_seq, p.* FROM sources s
              LEFT JOIN source_parse_state p ON p.source_id=s.id ORDER BY s.path;" \
              >"$RUNNER_TEMP/e2e/db-$p.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*/*/agent.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Scenario report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/e2e-report.md" ]; then
            cat "$RUNNER_TEMP/e2e-report.md" >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: ${{ runner.temp }}/e2e-report.md*
          if-no-files-found: ignore
          retention-days: 14
