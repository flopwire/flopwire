name: Perf nightly

# Nightly A/B benchmark on a synthetic corpus (docs/perf/README.md). The
# bench itself is perf-ab.yml, shared with the release-PR gate
# (perf-release.yml). Binary A is the pinned baseline
# (scripts/perf-baseline.sh: the newer of the latest v* tag and
# docs/perf/nightly-baseline), binary B is main. A regression opens or
# updates one issue labelled perf-regression; a later clean run closes it.
# A baseline that cannot run under B's harness opens one labelled
# perf-baseline-broken instead.
#
# Never runs on pull requests: the issue job must not be reachable from a
# PR. The release PR's gate is perf-release.yml.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      baseline:
        description: "One-off baseline: commit SHA or v* tag (default: the newer of the latest v* tag and docs/perf/nightly-baseline)"
        required: false
        default: ""
      runs:
        description: "Runs per binary (ABBA blocks: A,B,B,A,A,B for 3)"
        required: false
        default: "3"
      size:
        description: "Synthetic corpus size"
        required: false
        default: "1.5GB"

permissions:
  contents: read

concurrency:
  group: perf-nightly
  cancel-in-progress: false

jobs:
  bench:
    if: github.repository == 'flopwire/flopwire'
    permissions:
      contents: read
    uses: ./.github/workflows/perf-ab.yml
    with:
      ref: ${{ github.sha }}
      baseline: ${{ inputs.baseline || '' }}
      runs: ${{ inputs.runs || '3' }}
      size: ${{ inputs.size || '1.5GB' }}
      artifact: perf-nightly

  issue:
    needs: bench
    if: github.repository == 'flopwire/flopwire' && needs.bench.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: perf-nightly
          path: perf-out
      - name: Open, update or close the perf-regression issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERDICT: ${{ needs.bench.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only main may change the issue; other refs print what they would do.
          act=()
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then act=(echo "dry run:"); fi
          # REGRESSED -> perf-regression; BASELINE_FAILED (the pinned
          # baseline cannot run under main's harness; nothing compared) ->
          # perf-baseline-broken. CLEAN closes both. BASELINE_FAILED leaves
          # an open perf-regression issue alone: nothing was measured.
          "${act[@]}" gh label create perf-regression --color B60205 --description "The nightly perf A/B run found a regression" --force
          "${act[@]}" gh label create perf-baseline-broken --color FBCA04 --description "The nightly perf baseline cannot run under the current harness" --force
          { cat perf-out/summary.md; echo; echo "Run: $RUN_URL"; } >body.md
          open_issue() { gh issue list --label "$1" --state open --json number --jq '.[0].number // empty'; }
          report() { # report LABEL TITLE
            local num
            num="$(open_issue "$1")"
            if [[ -n "$num" ]]; then
              "${act[@]}" gh issue comment "$num" --body-file body.md
            else
              "${act[@]}" gh issue create --title "$2" --label "$1" --body-file body.md
            fi
          }
          resolve() { # resolve LABEL
            local num
            num="$(open_issue "$1")"
            if [[ -n "$num" ]]; then
              "${act[@]}" gh issue comment "$num" --body "Resolved: the nightly A/B run $RUN_URL is clean."
              "${act[@]}" gh issue close "$num"
            fi
          }
          case "$VERDICT" in
            REGRESSED)
              report perf-regression "Perf regression found by the nightly A/B bench"
              resolve perf-baseline-broken ;;
            BASELINE_FAILED)
              report perf-baseline-broken "Nightly perf baseline cannot run under the current harness" ;;
            CLEAN)
              resolve perf-regression
              resolve perf-baseline-broken ;;
            *)
              echo "unknown verdict '$VERDICT'" >&2
              exit 1 ;;
          esac
          echo "verdict $VERDICT"
