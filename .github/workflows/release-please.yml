name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      used_github_token: ${{ steps.app-token.outputs.token == '' && secrets.RELEASE_TOKEN == '' }}
    steps:
      # Match agentboard's App identity so release PRs run normal CI.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Pandora's PAT convention remains available when no App is configured.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main

  # GITHUB_TOKEN-created tags suppress push workflows. Call the same gate
  # directly for that fallback; App/PAT-created tags run it through push.
  verify-source-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.used_github_token == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/source-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
