name: Release

# Runs on the vX.Y.Z tag that release-please creates (pushed by the release
# App or a PAT). For tags created with GITHUB_TOKEN, which fire no push
# event, release-please.yml calls this workflow directly. Manual dispatch
# retries a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version tag to release
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The gate: the tag is a semantic version on main, tests pass, and the
  # tagged build prints the tag as its version.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Require a semantic version tag on main
        shell: bash
        run: |
          set -euo pipefail
          scripts/validate-release-tag.sh "$RELEASE_TAG"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - run: go test ./...
      - name: Build and verify tagged CLI
        run: |
          go build -trimpath -ldflags="-X main.version=$RELEASE_TAG" -o /tmp/flopwire ./cmd/flopwire
          actual=$(/tmp/flopwire version)
          test "$actual" = "$RELEASE_TAG"

  # Attaches the binaries to the release that release-please created and
  # pushes the server image. See .goreleaser.yaml.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write     # upload release assets
      packages: write     # push ghcr.io/flopwire/flopwire
      id-token: write     # artifact attestations
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser derives the tag from HEAD; make the retry path explicit.
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
      # Provenance for every archive, verifiable with
      # `gh attestation verify <file> --repo flopwire/flopwire`.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: dist/SHA256SUMS
