name: Source release gate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version tag to verify
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-source-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Require a semantic version tag on main
        shell: bash
        run: |
          set -euo pipefail
          scripts/validate-release-tag.sh "$RELEASE_TAG"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - run: go test ./...
      - name: Build and verify tagged CLI
        run: |
          go build -trimpath -ldflags="-X main.version=$RELEASE_TAG" -o /tmp/flopwire ./cmd/flopwire
          actual=$(/tmp/flopwire version)
          test "$actual" = "$RELEASE_TAG"
      - name: Confirm source-only policy
        run: test ! -e dist && test ! -e artifacts
