name: flopwire
services:
  postgres:
    restart: unless-stopped
    image: ${POSTGRES_IMAGE:-postgres:17.6-bookworm}
    environment:
      POSTGRES_DB: flopwire
      POSTGRES_USER: flopwire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flopwire -d flopwire"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    restart: unless-stopped
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flopwire}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - object-data:/data

  flopwire:
    build:
      context: .
    environment:
      FLOPWIRE_ADDR: :8080
      # TLS (D13): self-signed by default; devices pin its fingerprint
      # (`docker compose exec flopwire flopwire fingerprint`). Set FLOPWIRE_DOMAIN
      # for an ACME certificate, or FLOPWIRE_TLS=proxy behind your own
      # TLS-terminating reverse proxy.
      FLOPWIRE_TLS: ${FLOPWIRE_TLS:-auto}
      FLOPWIRE_DOMAIN: ${FLOPWIRE_DOMAIN:-}
      FLOPWIRE_ACME_EMAIL: ${FLOPWIRE_ACME_EMAIL:-}
      FLOPWIRE_TLS_DIR: /var/lib/flopwire/tls
      DATABASE_URL: postgres://flopwire:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/flopwire?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flopwire}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: flopwire
      S3_SECURE: "false"
      FLOPWIRE_TRUSTED_PROXY_CIDRS: ${FLOPWIRE_TRUSTED_PROXY_CIDRS:-}
      FLOPWIRE_AUTH_RATE_BURST: ${FLOPWIRE_AUTH_RATE_BURST:-10}
      FLOPWIRE_AUTH_RATE_REFILL: ${FLOPWIRE_AUTH_RATE_REFILL:-1m}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # The certificate devices pin. Losing it means re-pinning every device.
      - flopwire-tls:/var/lib/flopwire
    ports:
      - "${FLOPWIRE_BIND:-127.0.0.1}:${FLOPWIRE_PORT:-8080}:8080"
    restart: unless-stopped
    # On SIGTERM the server stops accepting connections, answers waiting
    # message-bus polls at once, and waits up to 10 s for requests in
    # flight. Docker's default 10 s would kill it at that same moment.
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "flopwire", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  postgres-data:
  object-data:
  flopwire-tls:
