# Curated from `cass search` invocations found in this device's
# transcripts. Skipped: help, wildcard and --robot-format sessions runs,
# templated ${q} strings, and queries holding account-like numbers or
# people's names. Filters kept: --workspace -> repo, --agent -> agent,
# absolute --since. Relative windows (--today, --days N, --week,
# --since=-3h) are dropped: the date each was run on is not recorded.
# Every query is bounded by until: 2026-09-29 (added by the script), so
# newer sessions cannot push expected hits off the first page.
# scripts/acceptance-expect.py derives `expect` by brute force over the raw
# transcripts and writes queries.yaml; `source` is the original invocation.
